
name: Conduit CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Test and Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: CI=true npm test -w frontend -- --watchAll=false

      - name: Run backend tests
        run: npm test -w backend -- --runInBand

      - name: Build frontend
        run: npm run build -w frontend


  docker-publish:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest

    needs: test-and-build

    # Publish only after a push to main.
    # Pull requests run CI but do not publish images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image names
        id: image
        run: |
          echo "owner=ghcr.io/daradjango12" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.owner }}/layodevops-frontend:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.owner }}/layodevops-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.owner }}/layodevops-backend:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.owner }}/layodevops-backend:latest



  deploy:
    name: Deploy to Ubuntu Server
    runs-on: ubuntu-latest

    needs: docker-publish

    permissions:
      contents: read
      packages: read

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "Checking registered SSH host key..."
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts


      - name: Deploy application with automatic rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -u
          cd ~/LayoDevopsConduit/realworld-example-app

          TAG_FILE=".last_deployed_image_tag"
          PREVIOUS_TAG=$(sudo cat "$TAG_FILE")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "ERROR: No previous deployment tag found."
            exit 1
          fi

          echo "Previous release: $PREVIOUS_TAG"
          echo "New release: $IMAGE_TAG"

          check_health() {
            for attempt in $(seq 1 12); do
              if curl -fsS http://localhost:3000/ >/dev/null \
                && curl -fsS http://localhost:3001/api/tags >/dev/null \
                && sudo docker compose exec -T db pg_isready >/dev/null 2>&1; then
                echo "Frontend, backend and database are healthy."
                return 0
              fi

              echo "Health check $attempt/12 failed. Retrying in 10 seconds..."
              sleep 10
            done
            return 1
          }

          rollback() {
            echo "Deployment failed. Restoring previous release: $PREVIOUS_TAG"

            if sudo env IMAGE_TAG="$PREVIOUS_TAG" docker compose up -d --no-deps backend frontend \
              && check_health; then
              echo "ROLLBACK SUCCESSFUL."
            else
              echo "CRITICAL: Rollback could not be verified."
              sudo docker compose ps
            fi

            exit 1
          }

          echo "Pulling new application images..."
          if ! sudo env IMAGE_TAG="$IMAGE_TAG" docker compose pull backend frontend; then
            echo "Image pull failed. Existing deployment remains unchanged."
            exit 1
          fi

          echo "Starting new application release..."
          if ! sudo env IMAGE_TAG="$IMAGE_TAG" docker compose up -d --no-deps backend frontend; then
            rollback
          fi

          echo "Checking new deployment..."
          if ! check_health; then
            rollback
          fi

          echo "$IMAGE_TAG" | sudo tee "$TAG_FILE.tmp" >/dev/null
          sudo mv "$TAG_FILE.tmp" "$TAG_FILE"

          echo "SUCCESS: Deployment verified."
          echo "Recorded release: $IMAGE_TAG"
          REMOTE

